<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双子でドボン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <div class="wrap">

    <header class="head">
      <div>
        <h1 id="title"></h1>
        <p class="intro" id="intro"></p>
      </div>
      <button class="btn" id="langBtn"></button>
    </header>

    <div class="cols">

      <div class="boardCard">
        <svg id="board" viewBox="0 0 560 560"></svg>
      </div>

      <div class="panel">

        <section>
          <div class="row">
            <button class="btn grow" id="resetBtn"></button>
          </div>
        </section>

        <div class="status" id="status">
          <div class="statusTitle" id="statusTitle"></div>
          <div class="statusSub" id="statusSub"></div>
        </div>

        <div class="stats">
          <div class="stat"><div class="statNum" id="statPoints">0</div><div class="statLab" id="labPoints"></div></div>
          <div class="stat"><div class="statNum" id="statTris">0</div><div class="statLab" id="labTris"></div></div>
          <div class="stat"><div class="statNum bad" id="statGroups">0</div><div class="statLab" id="labGroups"></div></div>
        </div>

        <div class="legend">
          <div class="legRow"><span class="swatch placed"></span><span id="legPlaced"></span></div>
          <div class="legRow"><span class="swatch match"></span><span id="legMatch"></span></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
